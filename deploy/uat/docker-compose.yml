name: convolab-uat

services:
  api:
    image: ${CONVOLAB_API_IMAGE_DIGEST:-convolab-api:latest}
    container_name: convolab-uat-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: UAT
      ConnectionStrings__DefaultConnection: Host=uat-db;Database=convolab_uat;Username=postgres;Password=postgres
      Database__Provider: PostgreSql
      Knowledge__StoragePath: /app/data/knowledge-documents
      DataProtection__KeyRingPath: /app/data/data-protection
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-dGhpc2lzYTMyeWVhcndhcnJhbnR5a2V5MTIzNDU2Nzg=}
    volumes:
      - ./data/backups:/app/data/backups
      - uat_knowledge_documents:/app/data/knowledge-documents
      - uat_data_protection_keys:/app/data/data-protection
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${CONVOLAB_STUDIO_IMAGE_DIGEST:-convolab-web:latest}
    container_name: convolab-uat-studio
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: convolab-uat-db
    environment:
      POSTGRES_DB: convolab_uat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - uat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  uat_db_data:
  uat_knowledge_documents:
  uat_data_protection_keys:
