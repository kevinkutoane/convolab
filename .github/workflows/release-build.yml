name: Release Build & Artifact Assembly

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0-alpha.16)'
        required: true
        default: '1.0.0-alpha.16'

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/convolab-api
  IMAGE_STUDIO: ghcr.io/${{ github.repository }}/convolab-studio

jobs:
  build-publish-and-attest:
    name: Build, Publish, Scan & Assemble Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry via OIDC / Token
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version & Metadata
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          COMMIT_SHA=$(git rev-parse HEAD)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MANIFEST_ID="release-manifest-${VERSION}-${COMMIT_SHA:0:8}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "manifest_id=${MANIFEST_ID}" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Api/ConvoLab.Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_API }},push=true

      - name: Build & Push Studio Image
        id: build-studio
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_STUDIO }}:${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_STUDIO }},push=true

      - name: Capture Image Digests
        id: digests
        run: |
          API_DIGEST="${{ steps.build-api.outputs.digest }}"
          STUDIO_DIGEST="${{ steps.build-studio.outputs.digest }}"
          echo "api_digest=${API_DIGEST}" >> $GITHUB_OUTPUT
          echo "studio_digest=${STUDIO_DIGEST}" >> $GITHUB_OUTPUT
          echo "API Digest: ${API_DIGEST}"
          echo "Studio Digest: ${STUDIO_DIGEST}"

      - name: Generate CycloneDX SBOMs
        id: sbom
        run: |
          mkdir -p artifacts/sbom artifacts/release
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX ConvoLab.sln -o artifacts/sbom -fn convolab-api-sbom.json

          cd web
          npx @cyclonedx/cyclonedx-npm --output-file ../artifacts/sbom/convolab-studio-sbom.json
          cd ..

          API_SBOM_HASH=$(sha256sum artifacts/sbom/convolab-api-sbom.json | awk '{print $1}')
          STUDIO_SBOM_HASH=$(sha256sum artifacts/sbom/convolab-studio-sbom.json | awk '{print $1}')
          echo "api_sbom_sha256=${API_SBOM_HASH}" >> $GITHUB_OUTPUT
          echo "studio_sbom_sha256=${STUDIO_SBOM_HASH}" >> $GITHUB_OUTPUT

      - name: Scan API Container for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Scan Studio Container for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_STUDIO }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Attest API Build Provenance & SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_API }}
          subject-digest: ${{ steps.digests.outputs.api_digest }}
          push-to-registry: true

      - name: Attest Studio Build Provenance & SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_STUDIO }}
          subject-digest: ${{ steps.digests.outputs.studio_digest }}
          push-to-registry: true

      - name: Assemble Immutable Release Manifest
        id: manifest
        run: |
          MANIFEST_FILE="artifacts/release/manifest.json"
          cat <<EOF > "$MANIFEST_FILE"
          {
            "releaseManifestId": "${{ steps.meta.outputs.manifest_id }}",
            "releaseVersion": "${{ steps.meta.outputs.version }}",
            "sourceCommitSha": "${{ steps.meta.outputs.commit }}",
            "apiImageDigest": "${{ env.IMAGE_API }}@${{ steps.digests.outputs.api_digest }}",
            "studioImageDigest": "${{ env.IMAGE_STUDIO }}@${{ steps.digests.outputs.studio_digest }}",
            "migrationVersion": "202608200002_DeploymentPromotionV1",
            "apiSbomSha256": "${{ steps.sbom.outputs.api_sbom_sha256 }}",
            "studioSbomSha256": "${{ steps.sbom.outputs.studio_sbom_sha256 }}",
            "provenanceReference": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "cryptographicAttestation": "github-actions-attest-build-provenance-v1",
            "buildWorkflowId": "${{ github.run_id }}",
            "buildTimestamp": "${{ steps.meta.outputs.timestamp }}",
            "isBackwardCompatible": true,
            "requiresDowntime": false
          }
          EOF
          echo "=== Release Manifest Assembled ==="
          cat "$MANIFEST_FILE"

      - name: Publish Release Manifest & SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            artifacts/release/manifest.json
            artifacts/sbom/
