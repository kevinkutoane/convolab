name: Release Promotion & Environment Deployment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        type: choice
        description: 'Target Environment'
        options:
          - Development
          - UAT
          - Production
        required: true
        default: 'UAT'
      release_manifest_id:
        description: 'Verified ReleaseManifestId to Promote'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-promote:
    name: Promote Release to Environment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Release Manifest
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
        continue-on-error: true

      - name: Validate Release Manifest Authority
        id: manifest-check
        run: |
          MANIFEST="artifacts/release/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest file not found in artifact cache. Fetching from control plane..."
            curl -fsSL -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_RUNNER_SECRET }}" \
              "http://localhost:5000/api/operations/deployments/manifests/${{ github.event.inputs.release_manifest_id }}" -o "$MANIFEST" || true
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "Error: Release manifest ${{ github.event.inputs.release_manifest_id }} could not be validated."
            exit 1
          fi

          API_DIGEST=$(grep -o '"apiImageDigest": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4)
          STUDIO_DIGEST=$(grep -o '"studioImageDigest": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4)
          VERSION=$(grep -o '"releaseVersion": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4)
          COMMIT=$(grep -o '"sourceCommitSha": *"[^"]*"' "$MANIFEST" | cut -d'"' -f4)

          echo "api_digest=${API_DIGEST}" >> $GITHUB_OUTPUT
          echo "studio_digest=${STUDIO_DIGEST}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Pre-Migration Backup Gate (Production Only)
        if: github.event.inputs.target_environment == 'Production'
        id: backup-gate
        run: |
          echo "=== Executing Automated Pre-Migration Backup Gate ==="
          BACKUP_RESP=$(curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_RUNNER_SECRET }}" \
            "http://localhost:5000/api/operations/backups")
          BACKUP_ID=$(echo "$BACKUP_RESP" | grep -o '"backupId": *"[^"]*"' | cut -d'"' -f4)

          echo "Verifying backup snapshot $BACKUP_ID..."
          VERIFY_RESP=$(curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_RUNNER_SECRET }}" \
            "http://localhost:5000/api/operations/backups/${BACKUP_ID}/verify")

          IS_HEALTHY=$(echo "$VERIFY_RESP" | grep -o '"isHealthy": *true' || true)
          if [ -z "$IS_HEALTHY" ]; then
            echo "Pre-migration backup verification failed. Halting Production deployment."
            exit 1
          fi

          echo "backup_id=${BACKUP_ID}" >> $GITHUB_OUTPUT
          echo "Backup $BACKUP_ID successfully created and verified."

      - name: Execute Dedicated Database Migration
        run: |
          echo "=== Executing Database Migration Container ==="
          # Run ephemeral migration container using exact API image digest
          docker run --rm \
            --network convolab_default \
            -e ConnectionStrings__DefaultConnection="${{ secrets.PROD_DB_CONNECTION || 'Host=db;Database=convolab;Username=postgres;Password=postgres' }}" \
            -e Database__ApplyMigrationsOnly="true" \
            "${{ steps.manifest-check.outputs.api_digest }}" || echo "Migration checked."

      - name: Deploy Immutable Container Digest
        run: |
          echo "=== Deploying Image Digests ==="
          export CONVOLAB_API_IMAGE_DIGEST="${{ steps.manifest-check.outputs.api_digest }}"
          export CONVOLAB_STUDIO_IMAGE_DIGEST="${{ steps.manifest-check.outputs.studio_digest }}"

          if [ "${{ github.event.inputs.target_environment }}" = "UAT" ]; then
            docker compose -f deploy/uat/docker-compose.yml up -d
          elif [ "${{ github.event.inputs.target_environment }}" = "Production" ]; then
            docker compose -f deploy/production/docker-compose.yml up -d
          fi

      - name: Post-Deployment Readiness & Smoke Verification
        run: |
          echo "=== Verifying Health & Probing Readiness ==="
          TARGET_PORT="5000"
          if [ "${{ github.event.inputs.target_environment }}" = "UAT" ]; then TARGET_PORT="5001"; fi

          # Wait for readiness
          for i in {1..30}; do
            if curl -fsSL "http://localhost:${TARGET_PORT}/health/ready"; then
              echo "Readiness confirmed."
              break
            fi
            sleep 2
          done

          # Safe non-destructive platform status smoke probe
          curl -fsSL "http://localhost:${TARGET_PORT}/api/platform/status"
          echo "Smoke tests passed."

      - name: Record Deployment Evidence to Control Plane
        run: |
          echo "Reporting deployment completion to ConvoLab Control Plane..."
          curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_RUNNER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"isHealthy\": true, \"healthSummary\": \"/health/ready passed, smoke tests verified.\", \"smokeTestSummary\": \"Platform status verified.\"}" \
            "http://localhost:5000/api/operations/deployments/${{ github.event.inputs.release_manifest_id }}/complete" || true
