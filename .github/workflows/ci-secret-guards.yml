name: CI secret guards
on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  check-reveal:
    name: RevealValue scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run RevealValue scan
        run: bash ./scripts/ci/check-no-reveal.sh
      - name: Run RevealValue guard fixture tests
        run: node ./scripts/ci/test-check-no-reveal.mjs
