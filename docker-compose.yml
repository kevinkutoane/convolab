name: convolab

services:
  api:
    build:
      context: .
      dockerfile: src/Api/ConvoLab.Api/Dockerfile
    container_name: convolab-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Database=convolab;Username=postgres;Password=postgres
      Database__Provider: PostgreSql
      Knowledge__StoragePath: /app/data/knowledge-documents
      Database__ApplyMigrationsOnStartup: "true"
      Bootstrap__Administrator__Email: ${CONVOLAB_BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__Administrator__DisplayName: ${CONVOLAB_BOOTSTRAP_ADMIN_NAME:-ConvoLab Administrator}
      Bootstrap__Administrator__Password: ${CONVOLAB_BOOTSTRAP_ADMIN_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CONVOLAB_MONTHLY_AI_BUDGET_ZAR: ${CONVOLAB_MONTHLY_AI_BUDGET_ZAR:-500}
      GEMINI_INPUT_PRICE_ZAR_PER_1K: ${GEMINI_INPUT_PRICE_ZAR_PER_1K:-}
      GEMINI_OUTPUT_PRICE_ZAR_PER_1K: ${GEMINI_OUTPUT_PRICE_ZAR_PER_1K:-}
      CONVOLAB_EVALUATION_MIN_GROUNDEDNESS: ${CONVOLAB_EVALUATION_MIN_GROUNDEDNESS:-0.80}
      CONVOLAB_EVALUATION_MIN_RELEVANCE: ${CONVOLAB_EVALUATION_MIN_RELEVANCE:-0.80}
      CONVOLAB_EVALUATION_MIN_SAFETY: ${CONVOLAB_EVALUATION_MIN_SAFETY:-0.95}
      CONVOLAB_EVALUATION_MIN_OVERALL: ${CONVOLAB_EVALUATION_MIN_OVERALL:-0.82}
      CONVOLAB_EVALUATION_FAILURE_ACTION: ${CONVOLAB_EVALUATION_FAILURE_ACTION:-Review}
      DataProtection__KeyRingPath: /app/data/data-protection
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./data/backups:/app/data/backups
      - knowledge_documents:/app/data/knowledge-documents
      - data_protection_keys:/app/data/data-protection
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: convolab-studio
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: convolab-db
    environment:
      POSTGRES_DB: convolab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector:0.136.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./tools/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
  knowledge_documents:
  data_protection_keys:
